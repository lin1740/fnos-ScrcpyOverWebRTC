# cloudphone（穿云投屏）运行时版本配置 —— 单一可信源（single source of truth）
#
# 【本文件是「用哪个上游镜像 / 哪个标签」的唯一配置点】
#   · 换镜像源或标签：只改下面的 REPO / TAG；
#   · 所有脚本（pull_image / install·upgrade·uninstall 回调 / net_mode）都从这里取值，
#     **禁止在别处写死镜像名与版本号**。
#
# 【设计原则】
#   1) 本文件只做「取值」，不含任何 if 分支；
#   2) 默认值与上游官方一致（buutuu/scrcpy-over-webrtc:latest）；
#   3) 需要临时覆盖时用环境变量（CLOUDPHONE_*），不要改本文件的默认值。

# ── 应用标识 ──
APP_NAME="${CLOUDPHONE_APP_NAME:-cloudphone}"

# ── 穿云投屏（ScrcpyOverWebRTC）镜像 ──
WEBRTC_REPO="${CLOUDPHONE_WEBRTC_REPO:-buutuu/scrcpy-over-webrtc}"
WEBRTC_TAG="${CLOUDPHONE_WEBRTC_TAG:-latest}"

# ── 镜像版本策略（重要）────────────────────────────────────────────────────
# 上游只发 :latest、没有语义化版本 tag。若跟随 :latest，上游一旦发布新版本
# （例如 0.4.1 → 0.4.2），后来安装的用户会直接拉到新镜像，而包里的配置/脚本还是
# 按旧版本写的 —— 结果就是「装完就坏」。
# 因此默认 **按 digest 钉死** 本包在真机上验证过的版本：
#   · digest 不可变，上游更新 :latest 完全不影响已装与新装用户；
#   · 升级是显式动作：bash scripts/set_image.sh --upgrade
#     （拉取 :latest → 冒烟校验 → 切到新 digest，失败自动回退）；
#   · 想跟随最新：bash scripts/set_image.sh --follow-latest（自担上游变更风险）。
# 用户覆盖优先级：/var/apps/cloudphone/var/image.conf > 本文件默认值。
WEBRTC_PIN="${CLOUDPHONE_WEBRTC_PIN:-1}"
WEBRTC_DIGEST="${CLOUDPHONE_WEBRTC_DIGEST:-sha256:70bf7ec67de34f0c9da3ea755af05d9a4b67aa7cf74d018e7b2dfff24e7c0118}"

# ── 加速源前缀（实测 fnOS 的 registry-mirrors 对官方名不生效，故直接用前缀名拉取）──
ACCEL_PREFIX="${CLOUDPHONE_ACCEL_PREFIX:-docker.fnnas.com}"

# ── 升级缓存 tag 前缀（飞牛升级按官方名清理镜像，缓存 tag 可存活，用于秒级恢复）──
CACHE_PREFIX="${CLOUDPHONE_CACHE_PREFIX:-cloudphone-cache}"

# ── 派生值（脚本直接使用，勿在此处手改；改上面几项即可）──
CANON_WEBRTC="${ACCEL_PREFIX}/${WEBRTC_REPO}:${WEBRTC_TAG}"
OFF_WEBRTC="${WEBRTC_REPO}:${WEBRTC_TAG}"
CACHE_WEBRTC="${CACHE_PREFIX}/webrtc:${WEBRTC_TAG}"

# ── compose 实际引用的本地镜像名（关键）────────────────────────────────────
# 为什么不用 @sha256 引用：compose 的 image 若写成 <registry>/<repo>@sha256:...，
# docker 会把它当成一个「独立的引用」去找本地镜像；本地只有 tag 形式的同一镜像时
# 它会尝试联网 pull，而 fnOS 镜像源(docker.fnnas.com) 对 digest 路径返回 401 →
# compose 建不出容器 → 应用中心启用报 12005「no container to start」（前端显示
# “docker不可用”）。
# 因此：compose 恒引用本地的稳定 tag（PINNED_WEBRTC），由 pull_image.sh /
# set_image.sh 负责把「按 digest 钉死的正确版本」拉下来并打上这个 tag。
# 钉死效果不变（内容仍由 digest 决定），但 compose 启动不再依赖联网。
PINNED_WEBRTC="${CACHE_PREFIX}/webrtc:pinned"
