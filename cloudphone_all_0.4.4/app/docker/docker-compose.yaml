name: cloudphone

# ============================================================================
# 穿云投屏（ScrcpyOverWebRTC）服务端 —— 单容器编排
#
# 本应用只做服务端：信令 + TURN 中继 + Web 管理面板。
# 安卓设备（真机 / 云机）通过官方 Agent 接入，不在这里运行安卓容器。
#
# 【端口说明】默认 8443 / 3478 / 50000-50029；安装向导可自定义，
#   安装后也可用 scripts/set_ports.sh 修改。改动由 scripts/apply_ports.sh
#   写回本文件（ports 映射 + EXTERNAL_* / COTURN_* 环境变量）。
#   容器内实际监听端口固定（信令 8443、TURN 3478、中继段与 COTURN_* 一致），
#   改的是「宿主对外映射端口」。
# ============================================================================

services:
  webrtc:
    image: docker.fnnas.com/buutuu/scrcpy-over-webrtc:latest
    pull_policy: missing
    container_name: cloudphone-webrtc
    restart: unless-stopped
    stop_grace_period: 30s
    # 去特权化：只运行 coturn 中转与 WebRTC 信令，无需特权模式
    ports:
      - "8443:8443/tcp"
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "50000-50029:50000-50029/udp"
    # 允许设置负 nice 值（提升 webrtc/turn 进程优先级，减少调度延迟）
    # CAP_SYS_NICE 仅影响进程调度优先级，不涉及设备/网络/文件系统访问
    cap_add:
      - SYS_NICE
    # 自定义 entrypoint：上游原版生成的 turnserver.conf 不含 listening-ip，
    # 会导致 coturn 只监听 docker 网桥、局域网/外网都连不上 TURN。
    # 本脚本在生成配置时就包含 listening-ip=0.0.0.0，并注入少量前端修正脚本。
    entrypoint: ["/bin/bash", "/custom-entrypoint.sh"]
    environment:
      # PUBLIC_IP 必须是「浏览器与手机都能访问到的地址」：
      #   局域网 = 宿主局域网 IP（net_mode.sh / 安装向导写入）；
      #   公网   = 公网 IP 或域名解析出的 IP。
      # 不能是容器内网 IP，否则对端拿到的 ICE 候选不可达。
      - PUBLIC_IP=${CLOUDPHONE_HOST_IP:-127.0.0.1}
      # 默认启用 HTTPS：Agent 走 wss 加密；浏览器直连首次需接受自签证书，
      # 走飞牛统一网关时由网关终结 TLS，无提示。
      - USE_TLS=true
      # 容器内实际监听端口（固定，不随对外映射变化）
      - SIGNALING_PORT=8443
      # 对外通告端口（apply_ports.sh 按 ports.conf 写入）
      - EXTERNAL_SIGNALING_PORT=8443
      - EXTERNAL_TURN_PORT=3478
      # TURN 认证（生产环境建议修改）
      - TURN_USER=cloudphone_user
      - TURN_PASSWORD=cloudphone_secure_password
      # TURN 媒体中继端口段（必须与上面 ports 的中继段一致，coturn 不支持端口转换）
      - COTURN_MIN_PORT=50000
      - COTURN_MAX_PORT=50029
      # 新接入设备的默认画质：60fps / 编码长边 1280 / 码率 4-16Mbps 动态 / 默认开音频
      # 注意：不要用单引号包裹值！否则 /api/default_settings 会返回带引号的非法 JSON。
      - DEFAULT_SETTINGS={"maxBitrate":12,"minBitrate":4,"fps":60,"size":1280,"bitrate":16,"audio":true,"stayAwake":true,"powerOff":false}
    volumes:
      # 持久化穿云投屏数据（admin 账号、设备绑定、标签、下载文件），容器重建不丢
      - cloudphone-webrtc-data:/app/data
      # 自定义 entrypoint
      - ./entrypoint_custom.sh:/custom-entrypoint.sh:ro

volumes:
  # external=true：卷由安装脚本显式创建（docker volume create），**不属于 compose 项目**。
  # 这样即使飞牛在卸载应用时执行 `docker compose down -v`，也不会删掉数据卷 ——
  # 之前用普通命名卷时，卸载（即便向导选了「保留数据」）会被连带删除，导致重装后
  # 账号/设备绑定全部丢失（群友实测）。
  cloudphone-webrtc-data:
    external: true
    name: cloudphone-webrtc-data

networks:
  default:
    name: cloudphone_default
